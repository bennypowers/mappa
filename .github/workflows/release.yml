name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Existing release tag to build/publish'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    uses: bennypowers/go-release-workflows/.github/workflows/build-binaries.yml@main
    with:
      binary-name: mappa
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release-tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: invalid release tag '$RELEASE_TAG'" >&2
            echo "Expected a semver tag like v1.2.3" >&2
            exit 1
          fi

      - name: Build WASM release binary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: make wasm-release WASM_VERSION="${RELEASE_TAG#v}"

      - name: Upload WASM assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            web/mappa.wasm \
            web/wasm_exec.js \
            --clobber

  npm:
    needs: [build, build-wasm]
    uses: bennypowers/go-release-workflows/.github/workflows/npm-publish.yml@v1.4
    with:
      binary-name: mappa
      npm-package-name: "@pwrs/mappa"
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      provenance: true
      pre-main-publish-script: |
        npm install && \
        npx tsc && \
        cp ../README.md ../LICENSE . && \
        node --experimental-strip-types ../scripts/update-platform-package-versions.ts && \
        bash ../scripts/download-wasm-assets.sh "$RELEASE_TAG"
